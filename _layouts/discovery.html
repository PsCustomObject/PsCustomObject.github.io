---
layout: default
---
<main id="main" class="discovery" aria-labelledby="page-title">
  <header class="discovery-heading">
    {% if page.topic_id %}<a class="discovery-back" href="{{ '/topics/' | relative_url }}">&larr; All topics</a>{% endif %}
    <p class="discovery-eyebrow">{{ page.eyebrow | default: 'FROM THE ARCHIVE' | escape }}</p>
    <h1 id="page-title">{{ page.title | escape }}</h1>
    {% if page.intro %}<p class="discovery-intro">{{ page.intro | escape }}</p>{% endif %}
  </header>
  {{ content }}
</main>
